# Standalone repo: its own workspace root so it doesn't get absorbed into a
# parent workspace. The blam-tags engine is pinned to a revision, not a
# submodule.
#
# The engine is camden-smallwood/blam-tags. Move it by pushing the engine
# change there and bumping the rev.
[workspace]
members = ["."]
default-members = ["."]

[package]
name = "baboon"
version = "0.3.2"
edition = "2024"
build = "build.rs"
default-run = "Baboon"

[[bin]]
name = "Baboon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false }
atomic-write-file = "0.3"
blam-tags = { git = "https://github.com/camden-smallwood/blam-tags", rev = "19e4c78bbc17aeb9b5fb43209cb2e5d521fe1b39", features = ["audio", "iostore", "halo5"] }
directories = "6"
display-info = "0.5"
# 0.37 made the clipboard a feature; without it copy and paste do nothing.
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
# The emoji fonts `default_fonts` carried until 0.37, which the sound player's
# controls and other icons draw with.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", features = ["image", "svg"] }
egui_tiles = "0.18"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.17"
rodio = { version = "0.20", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
xcb = "1.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWorkspace", "NSImage", "NSBitmapImageRep"] }
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.test]
opt-level = 1
debug = false

# audiopus_sys builds vendored Opus through CMake. A native Debug build uses
# MSVCRTD, while Rust's MSVC target links the release CRT even for `cargo build`,
# producing unresolved _CrtDbgReportW symbols. Keep only this native dependency
# on its release-runtime path during development builds.
[profile.dev.package.audiopus_sys]
opt-level = 1
debug = false

# egui 0.37.0 with eframe asking for the newest OpenGL core context first:
# on Windows it asked for exactly 3.3, which drivers gave, so Halo 3, ODST and
# Reach game shaders (4.1) never drew. Every egui crate comes from the same
# commit, or eframe's path dependencies make a second copy of egui. Drop this
# once egui releases the change.
[patch.crates-io]
ecolor = { git = "https://github.com/camden-smallwood/egui", rev = "ce0307b68be258b1ff57e92163c7518b24408dc6" }
eframe = { git = "https://github.com/camden-smallwood/egui", rev = "ce0307b68be258b1ff57e92163c7518b24408dc6" }
egui = { git = "https://github.com/camden-smallwood/egui", rev = "ce0307b68be258b1ff57e92163c7518b24408dc6" }
egui_extras = { git = "https://github.com/camden-smallwood/egui", rev = "ce0307b68be258b1ff57e92163c7518b24408dc6" }
egui_glow = { git = "https://github.com/camden-smallwood/egui", rev = "ce0307b68be258b1ff57e92163c7518b24408dc6" }
egui-wgpu = { git = "https://github.com/camden-smallwood/egui", rev = "ce0307b68be258b1ff57e92163c7518b24408dc6" }
egui-winit = { git = "https://github.com/camden-smallwood/egui", rev = "ce0307b68be258b1ff57e92163c7518b24408dc6" }
emath = { git = "https://github.com/camden-smallwood/egui", rev = "ce0307b68be258b1ff57e92163c7518b24408dc6" }
epaint = { git = "https://github.com/camden-smallwood/egui", rev = "ce0307b68be258b1ff57e92163c7518b24408dc6" }
epaint_default_fonts = { git = "https://github.com/camden-smallwood/egui", rev = "ce0307b68be258b1ff57e92163c7518b24408dc6" }
