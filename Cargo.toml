# Standalone repo: its own workspace root so it doesn't get absorbed into a
# parent workspace. The blam-tags engine is a pinned Git dependency
# (camden-smallwood/blam-tags), not a submodule.
[workspace]
members = ["."]
default-members = ["."]

[package]
name = "baboon"
version = "0.2.2"
edition = "2024"
build = "build.rs"
default-run = "Baboon"

[[bin]]
name = "Baboon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atomic-write-file = "0.3"
blam-tags = { git = "https://github.com/Zoephie/blam-tags", rev = "f7b28cfd954096e453745d7075cf2eb76e368cc3", features = ["audio", "iostore"] }
directories = "6"
display-info = "0.5"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.29", features = ["svg"] }
# Tiling layout for the editor area (rerun-io). Targets egui 0.29 exactly, so it
# drops in against the pinned eframe without a version bump.
egui_tiles = "0.10"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
libc = "0.2"
rfd = "0.15"
rodio = { version = "0.20", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
xcb = "1.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen"] }
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[profile.test]
opt-level = 1
debug = false

# audiopus_sys builds vendored Opus through CMake. A native Debug build uses
# MSVCRTD, while Rust's MSVC target links the release CRT even for `cargo build`,
# producing unresolved _CrtDbgReportW symbols. Keep only this native dependency
# on its release-runtime path during development builds.
[profile.dev.package.audiopus_sys]
opt-level = 1
debug = false
